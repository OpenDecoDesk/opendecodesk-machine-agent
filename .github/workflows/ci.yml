name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release: v<date>.<build>, from main"
        type: boolean
        default: false

# Releases run one at a time, so two can't take the same build number; other runs aren't held up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vet (every platform)
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          for os in darwin windows linux; do GOOS=$os go vet ./...; done
          go vet -tags testhooks ./...
      - name: Agent tests (stub machines on this computer)
        run: python test_agent.py

  # The original Python agent, while it's kept as the reference.
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python test_agent.py
        env:
          ODD_AGENT_IMPL: python

  # The version to build: `dev`, or for a release (Run workflow with "Publish a release" ticked)
  # today's date and the day's build number, YYYY.MM.DD.NN, from the tags already made.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # every tag, to count the day's releases
      - name: Test the version script
        run: scripts/test-next-version.sh
      - id: version
        name: The version
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.release }}" != true ]; then
            v=dev
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main only. Run the workflow on main."
            exit 1
          else
            v=$(scripts/next-version.sh)
          fi
          echo "Version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  installers:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: ./build.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/

  # Installs for real on a Windows runner (Task Scheduler, no admin needed), checks it answers,
  # and removes it again.
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install, check, remove
        shell: pwsh
        run: |
          go build -o agent.exe .
          ./agent.exe install --site https://admin.example.test --no-browser
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $ping = Invoke-RestMethod http://127.0.0.1:8787/ping
          if (-not $ping.ok) { throw "no /ping" }
          schtasks /Query /TN "OpenDecoDesk Machine Agent"
          if ($LASTEXITCODE -ne 0) { throw "no scheduled task" }
          $settings = Get-Content "$env:LOCALAPPDATA\OpenDecoDesk Machine Agent\settings.json" | ConvertFrom-Json
          if ($settings.sites -notcontains "https://admin.example.test") { throw "site not saved" }
          & "$env:LOCALAPPDATA\OpenDecoDesk Machine Agent\OpenDecoDesk Machine Agent.exe" uninstall --quiet
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          Start-Sleep -Seconds 6
          schtasks /Query /TN "OpenDecoDesk Machine Agent" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "task still there" }
          try { Invoke-RestMethod http://127.0.0.1:8787/ping -TimeoutSec 3; throw "still running" } catch { if ($_.Exception.Message -eq "still running") { throw } }
          if (Test-Path "$env:LOCALAPPDATA\OpenDecoDesk Machine Agent") { throw "folder still there" }
          $global:LASTEXITCODE = 0

  # Publishes the installers as the release v<version>, when run by hand on main with "Publish a
  # release" ticked, once every test has passed. The only job that may write.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [version, test, python-reference, installers, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release (and its tag)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --title "OpenDecoDesk Machine Agent $VERSION" --notes-file RELEASE_NOTES.md
